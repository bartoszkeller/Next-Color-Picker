# Checks the code and packs the extension for Chrome and Firefox.
#
# Every run uploads the packages as a workflow artifact. Pushing a v<version>
# tag also publishes them as a GitHub release; the tag must match the version
# in package.json.

name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read version
        id: package
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Check tag against package version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $VERSION"
            exit 1
          fi

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Lint Firefox build
        run: npm run lint:firefox

      - name: Pack
        run: node scripts/package.mjs

      - uses: actions/upload-artifact@v7
        with:
          name: next-color-picker-${{ steps.package.outputs.version }}
          path: artifacts/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Full history, so that the commits since the previous tag can be listed.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # Lists the commits since the previous tag, without the version bump
      # commits made by `npm version`. GitHub's generated notes (merged pull
      # requests and the full changelog link) are appended below.
      - name: Write release notes
        run: |
          previous=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          range=${previous:+$previous..}$GITHUB_REF_NAME

          {
            echo '## Changes'
            echo
            git log "$range" --no-merges --invert-grep --grep='^Release v' --pretty='- %s (%h)'
          } > release-notes.md
          cat release-notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/*.zip \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --generate-notes
